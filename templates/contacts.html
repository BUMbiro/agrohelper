{% extends "base.html" %}

{% block title %}Контакты{% endblock %}

{% block content %}
<h2 class="section-title">Свяжитесь с нами</h2>
<div class="row g-4">
    <div class="col-md-6">
        <form method="POST" action="/contacts">
            <div class="mb-2">
                <label for="name_contact" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name_contact" name="name_contact" required>
            </div>
            <div class="mb-2">
                <label for="email_contact" class="form-label">Email</label>
                <input type="email" class="form-control" id="email_contact" name="email_contact" required>
            </div>
            <div class="mb-2">
                <label for="message_contact" class="form-label">Сообщение</label>
                <textarea class="form-control" id="message_contact" name="message_contact" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>
    </div>
    <div class="col-md-6">
        <div class="card p-4">
            <h5>Наши контакты</h5>
            <p><i class="bi bi-envelope"></i> info@agrohelper.ru</p>
            <p><i class="bi bi-telephone"></i> +7 (8512) 12-34-56</p>
            <p><i class="bi bi-geo-alt"></i> г. Астрахань, ул. Агрономическая, д. 1</p>
            <hr>
            <h6>Мы на карте</h6>
            <div style="position:relative; overflow:hidden;">
                <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3A1234567890abcdef&source=constructor" width="100%" height="250" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>
</div>
{% endblock %}
