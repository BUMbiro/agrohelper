{% extends "base.html" %}

{% block title %}Контакты{% endblock %}

{% block content %}
<h2 class="mb-4" style="color: #7ec8e3;">Свяжитесь с нами</h2>
<div class="row g-4">
    <div class="col-md-6">
        <form method="POST" action="/contacts">
            <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Сообщение</label>
                <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Отправить</button>
        </form>
    </div>
    <div class="col-md-6">
        <div class="card p-3">
            <h5 style="color: #7ec8e3;">Наш офис в Астрахани</h5>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2752.0!2d48.036!3d46.349!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x41a90f8b6b4d3f2d%3A0x3f7e4b3c8f5b2e1a!2sAstrakhan%2C%20Astrakhan%20Oblast%2C%20Russia!5e0!3m2!1sen!2sru!4v1234567890" width="100%" height="250" style="border:0; border-radius: 15px;" allowfullscreen loading="lazy"></iframe>
        </div>
    </div>
</div>
{% endblock %}
